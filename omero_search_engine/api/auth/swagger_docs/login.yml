To log in and obtain a JWT, you can provide login data as a JSON string. For example:
{
  "username": "user-name",
  "password": "omero",
  "data_source": "datasource"
}

Alternatively, you can log in using a session ID with the following JSON format:
{
  "session_id": "user_session_id",
  "data_source": "datasource"
}
---
tags:
 - login

parameters:
  - name: data
    description: Json contains OMERO username and password
    in: body
    required: true

responses:
  200:
    description: A JSON contains the token
