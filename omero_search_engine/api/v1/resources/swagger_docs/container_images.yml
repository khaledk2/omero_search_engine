A IDR searcher endpoint to return the available containers and the number of images in each.
---
tags:
  - Containers and the number of images in each container

security:
    - bearerAuth: []  # Option 1: Send the JWT token
    - {}
parameters:
  - name: data_source
    in: query
    type: string
    required: false
    description:  If data source is specified in the request, it will be used. Otherwise, the default data source will be used. If no default data source is configured, results from all available data sources will be returned.
  - name: user_data
    description: Filter the search results to only include data owned by the user
    in: query
    type: boolean
    required: false

responses:
  200:
    description: A JSON containing the search results
    examples:
      results: []
