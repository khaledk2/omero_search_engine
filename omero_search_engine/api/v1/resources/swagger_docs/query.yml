The endpoint accepts a search term to query resources. If the search term is an integer, the endpoint retrieves and returns all resources that have this integer as their ID. If the search term is not an integer, the endpoint searches through all key-value pairs within the resources, returning those where the search term appears in either the key or the value.
For example, this query "/api/v1/resources/query/1597" will return the resources, e.g. image, project, which its ide is 1597.
Another example, "/api/v1/resources/query/cell" will return all key or value which cell is part of their names.
---
tags:
 - Resource Search by ID or Substring
security:
    - bearerAuth: []  # Option 1: Send the JWT token
    - {}
parameters:
  - name: search_term
    description: search term
    in: path
    type: string
    required: true
  - name: resource
    in: query
    type: string
    enum: ['all', 'image','dataset','project', 'dataset', 'screen', 'well']
    required: false
  - name: data_source
    in: query
    type: string
    required: false
    description: If a specific data source is provided, results will be retrieved from that source. Otherwise, the default data source will be used. If there is no default data source configured, results will be gathered from all available sources.

responses:
  200:
    description: A JSON contains the results.
    schema:
      $ref: '#/definitions/names'
    examples:
      results: []