a Simple query method uses search term, if the search term is an integer, it will search all the resources and returns the resources which have this id.
Otherwise, it will search all the key/value pairs where the search terms is a part of the key or value.
---
tags:
 - Main query method
security:
    - bearerAuth: []  # Option 1: Send the JWT token
    - {}
parameters:
  - name: search_term
    description: search term
    in: path
    type: string
    required: true
  - name: resource
    in: query
    type: string
    enum: ['all', 'image','dataset','project', 'dataset', 'screen', 'well']
    required: false
  - name: data_source
    in: query
    type: string
    required: false
    description: If a specific data source is provided, results will be retrieved from that source. Otherwise, the default data source will be used. If there is no default data source configured, results will be gathered from all available sources.

responses:
  200:
    description: A JSON contains resource attribute values only.
    schema:
      $ref: '#/definitions/names'
    examples:
      results: []